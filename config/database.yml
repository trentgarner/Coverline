# One database for everything: app data, Solid Cache, Solid Queue and Solid Cable.
# Production (Railway) reads DATABASE_URL; nothing secret lives in this file.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: coverline_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
test:
  <<: *default
  database: coverline_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
